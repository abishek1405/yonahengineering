    <!-- Initial page loader: inline so it paints before the app bundle arrives -->
    <style>
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fff;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      .pl-inner {
        width: min(260px, 70vw);
        text-align: center;
      }
      .pl-logo {
        display: block;
        width: 170px;
        height: auto;
        margin: 0 auto 28px;
      }
      .pl-track {
        height: 4px;
        border-radius: 4px;
        background: #e6eef8;
        overflow: hidden;
      }
      /* scaleX instead of width so the fill animates on the GPU */
      .pl-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #17518f, #1f65b0 60%, #6aaeec);
        transform: scaleX(0);
        transform-origin: 0 50%;
      }
      .pl-meta {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font: 600 12px/1 'Poppins', system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #667387;
      }
      .pl-pct {
        color: #0e1b2d;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
    </style>
  </head>

    <script>
      // Counts 0 → 100%. Creeps toward 90% while the page loads, finishes on window "load",
      // then fades out. A safety timeout guarantees it never blocks the site.
      (function () {
        var el = document.getElementById('page-loader');
        var fill = el.querySelector('.pl-fill');
        var pct = el.querySelector('.pl-pct');
        var root = document.documentElement;
        var shown = 0;
        var target = 0;
        var finished = false;
        var start = performance.now();
        root.style.overflow = 'hidden';

        function finish() {
          finished = true;
          target = 100;
        }
        function hide() {
          root.classList.add('is-loaded'); // starts the hero entrance animation
          el.classList.add('is-done');
          root.style.overflow = '';
          setTimeout(function () { el.remove(); }, 600);
        }
        function frame(now) {
          if (!finished) {
            // ease toward 90% over time; slows down as it gets closer
            var t = (now - start) / 1000;
            target = Math.max(target, 90 * (1 - Math.exp(-t * 1.6)));
          }
          shown += (target - shown) * (finished ? 0.2 : 0.12);
          if (finished && target - shown < 0.5) shown = 100;
          var v = Math.floor(shown);
          fill.style.transform = 'scaleX(' + (shown / 100).toFixed(4) + ')';
          pct.textContent = v + '%';
          el.setAttribute('aria-valuenow', v);
          if (shown >= 100) {
            setTimeout(hide, 250);
          } else {
            requestAnimationFrame(frame);
          }
        }
        requestAnimationFrame(frame);

        if (document.readyState === 'complete') finish();
        else window.addEventListener('load', finish);
        setTimeout(finish, 8000); // never wait longer than 8s
      })();
    </script>
